name: Deploy to GitHub Pages

# Publishes the repository root to the gh-pages branch, which GitHub Pages
# serves. (The actions-based Pages flow needs the Pages site pre-created in
# repo settings; the gh-pages branch route works without that.)

on:
  push:
    branches:
      - main
      - claude/fire-calculator-expenses-hp0xrn
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push --force origin gh-pages
